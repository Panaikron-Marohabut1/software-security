name: security-ci

# NoteVault security gate for Week 2 / Week 15 lab work.
#
# Actions are pinned to commit SHAs (not mutable tags like @v4/@master) — the
# same supply-chain control Week 12 teaches. Bump the SHA and the trailing
# version comment together.
#
# The intentionally vulnerable NoteVault target is included so this workflow
# demonstrates a failing security gate during the lab.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # to upload SARIF to the Security tab

jobs:
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Gate on high-severity Semgrep findings
        run: cd project/starter-app && semgrep scan --config p/default --config p/owasp-top-ten --severity ERROR --error . --no-git-ignore


  secrets:
    name: Secret scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        run: >-
          docker run --rm
          -v "${{ github.workspace }}/project/starter-app:/repo"
          zricethezav/gitleaks:latest detect --no-git -s /repo --exit-code 1 -v

  sca:
    name: SCA (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Trivy filesystem scan (deps + misconfig)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: project/starter-app
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'      # fail the build on HIGH/CRITICAL
          limit-severities-for-sarif: true
          format: sarif
          output: trivy-results.sarif
      - name: Upload results to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3  # v4.37.6
        with:
          sarif_file: trivy-results.sarif
